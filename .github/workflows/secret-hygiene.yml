name: Secret hygiene
on: [pull_request, push]
permissions:
  contents: read
jobs:
  staged-text-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify redaction and detection regressions
        run: node --test tools/secret-hygiene.test.cjs
      - name: Scan tracked index without exposing matches
        run: node tools/secret-hygiene.cjs .
